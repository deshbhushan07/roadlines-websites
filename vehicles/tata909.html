<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tata 909 — DRRL</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .vehicle-hero { display:flex; gap:30px; align-items:flex-start; max-width:1100px; margin:30px auto; padding:20px; }
    .vehicle-image { flex:1 1 480px; background:#fff; border-radius:8px; padding:12px; box-shadow:0 6px 20px rgba(0,0,0,0.08); display:flex; justify-content:center; }
    .vehicle-image img { max-width:100%; border-radius:6px; }
    .vehicle-info { flex:0 0 420px; background:white; padding:20px; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
    .vehicle-info h1 { margin:0 0 6px; font-size:1.6rem; color:#002244; }
    .badge { background:#ffd200; padding:6px 10px; border-radius:4px; font-weight:700; }
    .specs dt { font-weight:700; margin-top:10px; }
    .specs dd { margin:0 0 8px; }
    .back-link { margin-bottom:12px; display:inline-block; color:#002244; text-decoration:none; font-weight:600; }
    @media (max-width:900px){ .vehicle-hero{flex-direction:column;} .vehicle-info{width:100%;} }
  </style>
</head>

<body>
<header class="navbar">
  <div class="logo-container">
    <img src="../images/DRL_Logo.png" class="logo-img" />
    <span class="brand-title">Deshbhushan & Rushikesh Roadlines</span>
  </div>
  <nav class="nav-links">
    <a href="../index.html">Home</a>
    <a href="../index.html#about">About</a>
    <a href="../index.html#services">Services</a>
    <a href="../index.html#contact">Contact</a>
  </nav>
</header>

<main>
  <div class="vehicle-hero">

    <div class="vehicle-image">
      <img src="../images/tata909.jpeg" alt="Tata 909">
    </div>

    <aside class="vehicle-info">
      <a href="../index.html" class="back-link">← Back</a>
      <h1>Tata 909</h1>
      <div class="badge">6 Ton — 17 ft</div>

      <dl class="specs">
        <dt>Gross Vehicle Weight</dt><dd>9500 kg</dd>
        <dt>Tare Weight</dt><dd>4300 kg</dd>
        <dt>Payload</dt><dd>5000–5200 kg</dd>
        <dt>Body Length</dt><dd>17 ft</dd>
        <dt>Best For</dt><dd>Medium loads, MIDC transport, factory pickup</dd>
      </dl>

      <p style="margin-top:14px;">
        <a href="tel:+919860412709" style="background:#002244;color:white;padding:10px 14px;border-radius:6px;text-decoration:none;">Call</a>
        <a href="https://wa.me/919860412709" style="margin-left:8px;background:#ffd200;padding:10px 12px;border-radius:6px;text-decoration:none;color:#111;">WhatsApp</a>
      </p>
    </aside>

  </div>
</main>

<footer class="footer">
  &copy; 2025 Deshbhushan & Rushikesh Roadlines.
</footer>

</body>
</html>
